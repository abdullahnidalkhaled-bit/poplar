name: Bug report
description: Something does not work as documented
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Do not paste real passwords, session cookies, `.env` contents or customer/financial data.** If this is a security problem, use a private security advisory instead (see SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Inventory / series / stock
        - Cashier (POS) / invoices / returns
        - Cash accounts / Finance dashboard / expenses
        - Suppliers / consignment
        - Employees / payroll / advances
        - Users / permissions / login
        - Scripts (seed, reset, migrate, backup)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Exact error text helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`, or the release you are running.
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.12.0"
  - type: dropdown
    id: mongo
    attributes:
      label: MongoDB topology
      options:
        - Standalone (DISABLE_TRANSACTIONS=true)
        - Replica set (transactions)
        - Not sure
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output or screenshots
      description: Redact anything sensitive.
      render: shell
